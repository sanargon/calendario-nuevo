function parseLocalISO(iso){ // "YYYY-MM-DD" a Date local
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y, m-1, d); // local
}

function daysBetweenLocal(a, b){
  const msPerDay = 24*60*60*1000;
  const da = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const db = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((da - db)/msPerDay);
}

// Dada una fecha local (gregoriana), devuelve {monthIndex, dayInMonth, delta} según tu ancla.
function gregorianToNewLocal(localDate){
  const y = localDate.getFullYear();
  let anchor = firstSundayOfMarch(y);
  // firstSundayOfMarch usa UTC en tu código; aquí lo convertimos a local equivalente:
  anchor = new Date(anchor.getUTCFullYear(), anchor.getUTCMonth(), anchor.getUTCDate());

  if(localDate < anchor){
    let a2 = firstSundayOfMarch(y-1);
    anchor = new Date(a2.getUTCFullYear(), a2.getUTCMonth(), a2.getUTCDate());
  }

  const delta = daysBetweenLocal(localDate, anchor);
  if(delta < 0 || delta > 363) return null;

  const monthIndex = Math.floor(delta / 28);
  const dayInMonth = (delta % 28) + 1;
  return { monthIndex, dayInMonth, delta };
}

function mod(n, m){ return ((n % m) + m) % m; }

// Convierte fecha ISO "YYYY-MM-DD" (local) a dayDelta (0..363)
function isoToDayDelta(iso){
  const d = parseLocalISO(iso);
  const mapped = gregorianToNewLocal(d);
  return mapped ? mapped.delta : null;
}

// Devuelve el evento (clímax) en dayDelta para el año actual
function getEventDelta(year, eventKey){
  const ev = SOLAR_EVENTS[year];
  if(!ev) return null;
  return isoToDayDelta(ev[eventKey]);
}

    { key:"springEquinox",  name:"Equinoccio de Primavera",  transKey:"invierno->primavera" },
    { key:"summerSolstice", name:"Solsticio de Verano",      transKey:"primavera->verano" },
    { key:"autumnEquinox",  name:"Equinoccio de Otoño",      transKey:"verano->otono" },
    { key:"winterSolstice", name:"Solsticio de Invierno",    transKey:"otono->invierno" },
  ];

  for(const e of events){
    const evDelta = getEventDelta(year, e.key);
    if (evDelta === null) continue;

    // diferencia directa y ventana [-3..+3]
    const raw = dayDelta - evDelta;

    if (raw >= -3 && raw <= 3) {
      const mode = raw < 0 ? "iniciacion" : (raw === 0 ? "climax" : "integracion");
      return { isTransition:true, transKey:e.transKey, eventName:e.name, offset:raw, mode };
    }
  }
  return { isTransition:false };
}

// Inicios reales de estación (después de integración): evento + 4
function getSeasonStartsForYear(year){
  const spring = mod(getEventDelta(year,"springEquinox")  + 4, 364);
  const summer = mod(getEventDelta(year,"summerSolstice") + 4, 364);
  const autumn = mod(getEventDelta(year,"autumnEquinox")  + 4, 364);
  const winter = mod(getEventDelta(year,"winterSolstice") + 4, 364);

  return [
    { key:"primavera", start:spring },
    { key:"verano",    start:summer },
    { key:"otono",     start:autumn },
    { key:"invierno",  start:winter },
  ].sort((a,b)=>a.start-b.start);
}

function getSeasonByStarts(dayDelta, starts){
  let idx = -1;
  for(let i=0;i<starts.length;i++){
    if(dayDelta >= starts[i].start) idx = i;
  }
  if(idx === -1) idx = starts.length - 1;
  return starts[idx];
}

// Construye un set de días (1..28) a resaltar para el mes actual, con flags de climax
function getMonthHighlightsForYear(targetYear, currentMonthIndex){
  const ev = SOLAR_EVENTS[targetYear];
  if(!ev) return { windowDays: new Set(), climaxDays: new Set(), typeByDay: {} };

  const events = [
    { key: "springEquinox", type: "equinox" },
    { key: "autumnEquinox", type: "equinox" },
    { key: "summerSolstice", type: "solstice" },
    { key: "winterSolstice", type: "solstice" },
  ];

  const windowDays = new Set();
  const climaxDays = new Set();
  const typeByDay = {}; // day -> "equinox"|"solstice"

  for(const e of events){
    const center = parseLocalISO(ev[e.key]);
    for(let offset = -WINDOW_DAYS; offset <= WINDOW_DAYS; offset++){
      const d = new Date(center);
      d.setDate(d.getDate() + offset);

      const mapped = gregorianToNewLocal(d);
      if(!mapped) continue;

      // solo si cae en el mes que estamos mostrando
      if(mapped.monthIndex === currentMonthIndex){
        windowDays.add(mapped.dayInMonth);
        typeByDay[mapped.dayInMonth] = e.type;
        if(offset === 0) climaxDays.add(mapped.dayInMonth);
      }
    }
  }

  return { windowDays, climaxDays, typeByDay };
}

function firstSundayOfMarch(year){
  // busca el primer domingo entre 1 y 7 de marzo
  for(let day=1; day<=7; day++){
    const d = new Date(Date.UTC(year, 2, day)); // mes 2 = marzo (UTC)
    if(d.getUTCDay() === 0) return d; // 0 = domingo
  }
  throw new Error("No se encontró domingo en 1-7 de marzo (imposible).");
}

function setTodayDefault(){
  const now = new Date(); // fecha local del dispositivo
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  document.getElementById("date").value = `${y}-${m}-${d}`;
}

function toISODateUTC(d){
  // d es Date en UTC. devuelve YYYY-MM-DD
  const y = d.getUTCFullYear();
  const m = String(d.getUTCMonth()+1).padStart(2,'0');
  const da = String(d.getUTCDate()).padStart(2,'0');
  return `${y}-${m}-${da}`;
}

function parseInputDateToUTC(){
  const val = document.getElementById("date").value; // YYYY-MM-DD
  if(!val) return null;
  const [y,m,d] = val.split("-").map(Number);
  // Construimos la fecha como "medianoche UTC" del día elegido
  return new Date(Date.UTC(y, m-1, d));
}

function startOfDay(dt){
  return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
}
function addDaysLocal(dt, n){
  const d = startOfDay(dt);
  d.setDate(d.getDate() + n);
  return d;
}
function daysDiff(a, b){
  const ms = 24*60*60*1000;
  return Math.round((startOfDay(a) - startOfDay(b)) / ms);
}

function buildEventListAround(year){
  const ys = [year-1, year, year+1];
  const out = [];
  for(const y of ys){
    const ev = SOLAR_EVENTS[y];
    if(!ev) continue;
    out.push({ key:"springEquinox",  name:"Equinoccio de Primavera",  date: parseLocalISO(ev.springEquinox)  });
    out.push({ key:"summerSolstice", name:"Solsticio de Verano",      date: parseLocalISO(ev.summerSolstice) });
    out.push({ key:"autumnEquinox",  name:"Equinoccio de Otoño",      date: parseLocalISO(ev.autumnEquinox)  });
    out.push({ key:"winterSolstice", name:"Solsticio de Invierno",    date: parseLocalISO(ev.winterSolstice) });
  }
  out.sort((a,b)=>a.date-b.date);
  return out;
}

function seasonKeyFromEventKey(evKey){
  return { springEquinox:"primavera", summerSolstice:"verano", autumnEquinox:"otono", winterSolstice:"invierno" }[evKey];
}
function transKeyFromEventKey(evKey){
  return { springEquinox:"invierno->primavera", summerSolstice:"primavera->verano", autumnEquinox:"verano->otono", winterSolstice:"otono->invierno" }[evKey];
}

// Motor astronómico: Etapa 1–3 fijas (21) y Etapa 4 variable hasta el siguiente clímax.
function getAstroStateForDate(selectedLocalDate){
  const d = startOfDay(selectedLocalDate);
  const events = buildEventListAround(d.getFullYear());
  if(events.length < 4) return { error:true, message:"Faltan SOLAR_EVENTS para calcular eventos." };

  let nextIdx = events.findIndex(e => startOfDay(e.date) >= d);
  if(nextIdx === -1) nextIdx = events.length - 1;
  const nextEvent = events[nextIdx];
  const prevEvent = events[nextIdx - 1] || events[events.length - 1];

  // Transición = cualquier evento ±3 (iniciación/clímax/integración)
let closest = null;
for (const e of events) {
  const diff = daysDiff(d, e.date); // d - e.date
  if (diff >= -3 && diff <= 3) {
    closest = { event: e, diff };
    break;
  }
}

if (closest) {
  const diff = closest.diff;
  const mode = diff < 0 ? "iniciacion" : (diff === 0 ? "climax" : "integracion");
  return {
    isTransition: true,
    mode,
    eventName: closest.event.name,
    transKey: transKeyFromEventKey(closest.event.key),
  };
}

  const seasonKey = seasonKeyFromEventKey(prevEvent.key);

  const stage1Start = addDaysLocal(prevEvent.date, 4);
  const stage1End   = addDaysLocal(stage1Start, 20);

  const stage2Start = addDaysLocal(stage1Start, 21);
  const stage2End   = addDaysLocal(stage2Start, 20);

  const stage3Start = addDaysLocal(stage1Start, 42);
  const stage3End   = addDaysLocal(stage3Start, 20);

  const stage4Start = addDaysLocal(stage1Start, 63);
  const stage4End   = addDaysLocal(nextEvent.date, -4);

  let mesoKey = "cierre";
  if(d >= stage1Start && d <= stage1End) mesoKey = "apertura";
  else if(d >= stage2Start && d <= stage2End) mesoKey = "desarrollo";
  else if(d >= stage3Start && d <= stage3End) mesoKey = "evaluacion";
  else if(d >= stage4Start && d <= stage4End) mesoKey = "cierre";

  return { isTransition:false, seasonKey, mesoKey, nextEventName: nextEvent.name };
}

function getCellDateFromDayDelta(anchorLocalDate, dayDelta){
  return addDaysLocal(anchorLocalDate, dayDelta);
}

function mesoLabel(key){
  return {
    apertura: "Apertura",
    desarrollo: "Desarrollo",
    evaluacion: "Evaluación",
    cierre: "Cierre"
  }[key] || key;
}

function microWeekFromDayInMonth(dayInMonth){
  return Math.floor((dayInMonth - 1) / 7) + 1; // 1..4
}

function isSaturdayNew(dayInMonth){
  // Semana inicia domingo: 7,14,21,28 son sábado
  return dayInMonth % 7 === 0;
}

// Decide qué mostrar en “Próximamente” (macro/meso) y (micro)
function getUpcoming(selectedLocal, dayInMonth){
  const tomorrow = addDaysLocal(selectedLocal, 1);

  const astroTomorrow = getAstroStateForDate(tomorrow);
  const astroToday = getAstroStateForDate(selectedLocal);

  // 1) Prioridad máxima: mañana inicia cruce astronómico (iniciación)
  // Es decir: mañana ya es transición y está en modo "iniciacion"
  let primary = null;

  if (!astroTomorrow.error && astroTomorrow.isTransition && astroTomorrow.mode === "iniciacion") {
    primary = {
      type: "astro",
      line1: UPCOMING.astro.subtitle,
      line2: UPCOMING.astro.phrase
    };
  } else {
    // 2) Cambio de etapa mesociclo (solo si mañana cambia mesoKey y ambos días NO están en transición)
    if (!astroToday.error && !astroTomorrow.error &&
        !astroToday.isTransition && !astroTomorrow.isTransition &&
        astroToday.mesoKey && astroTomorrow.mesoKey &&
        astroToday.mesoKey !== astroTomorrow.mesoKey) {

      primary = {
        type: "meso",
        title: "[Próximamente]",
        line1: `${mesoLabel(astroToday.mesoKey)} → ${mesoLabel(astroTomorrow.mesoKey)}`,
        line2: MESO_UNIVERSAL[astroTomorrow.mesoKey]?.phrase || ""
      };
    }
  }

  // 3) Microciclo: todos los sábados (mañana inicia semana nueva)
  let micro = null;
  if (isSaturdayNew(dayInMonth)) {
    const current = microWeekFromDayInMonth(dayInMonth);
    const next = (current % 4) + 1; // 4->1
    micro = {
      title: "[Microciclo]",
      line1: `Mañana: ${MICRO[next].label}`,
      line2: MICRO[next].phrase
    };
  }

  return { primary, micro };
}

function renderUpcomingBlock(selectedLocal, dayInMonth){
  const u = getUpcoming(selectedLocal, dayInMonth);

  // Si no hay nada que mostrar, no renderiza
  if (!u.primary && !u.micro) return "";

  let html = `<div class="upcoming"><div class="t">[Próximamente]</div>`;

  if (u.primary) {
    html += `
      
      <div class="s">${u.primary.line1}</div>
      <div class="p">${u.primary.line2}</div>
    `;
  }

  if (u.micro) {
    html += `
      <div class="upcoming small">
        <div class="t">${u.micro.title}</div>
        <div class="s">${u.micro.line1}</div>
        <div class="p">${u.micro.line2}</div>
      </div>
    `;
  }

  html += `</div>`;
  return html;
}

function convert(){
  const input = parseInputDateToUTC();
  if(!input) return;

  const y = input.getUTCFullYear();
  let anchor = firstSundayOfMarch(y);
  if(input < anchor){
    anchor = firstSundayOfMarch(y-1);
  }

  // delta días respecto al anchor (Marzo 1)
  const msPerDay = 24*60*60*1000;
  const delta = Math.floor((input - anchor)/msPerDay);

  let resultText = "";
  let detailText = `Ancla (Marzo 1): ${toISODateUTC(anchor)} (Domingo)<br/>`;

  if (delta === -1) {
  resultText = "Día 0 (Día Fuera del Tiempo)";
  detailText += `Fecha gregoriana: ${toISODateUTC(input)}<br/>No tiene día de semana dentro del calendario nuevo.`;

  // Día 0: no hay mes, así que ocultamos/limpiamos la cuadrícula
  const mg = document.getElementById("monthGrid");
  if (mg) mg.innerHTML = "";

  const cp = document.getElementById("contextPanel");
  if (cp) cp.innerHTML = "";

} else if (delta >= 0 && delta <= 363) {
  const monthIndex = Math.floor(delta / 28);
  const dayInMonth = (delta % 28) + 1;
  const weekday = weekdays[delta % 7];

  CURRENT_MONTH_INDEX = monthIndex;
  CURRENT_ANCHOR_YEAR = input.getFullYear();

  resultText = `${months[monthIndex]} ${dayInMonth} (${weekday})`;
  detailText += `Delta desde ancla: ${delta} días<br/>`;
  detailText += `Mes #: ${monthIndex + 1} de 13<br/>`;
  detailText += `Día de semana (nuevo): ${weekday}`;

  // Aquí sí dibujamos el mes y marcamos el día
  const anchorLocal = new Date(anchor.getUTCFullYear(), anchor.getUTCMonth(), anchor.getUTCDate());
  const selectedLocal = new Date(input.getUTCFullYear(), input.getUTCMonth(), input.getUTCDate());

  renderMonthGrid(dayInMonth, anchorLocal);

  const astro = getAstroStateForDate(selectedLocal);

  if (astro.isTransition) {
  renderTransitionPanelAstro(astro, selectedLocal, dayInMonth);
} else {
  renderStandardPanelAstro(astro, dayInMonth, selectedLocal);
}

  document.getElementById("out").style.display = "block";

} else {
  resultText = "Fuera de rango (revisa ancla o fecha).";
  detailText += `Delta: ${delta}`;

  // Si por alguna razón cae fuera de rango, también limpia la cuadrícula
  const mg = document.getElementById("monthGrid");
  if (mg) mg.innerHTML = "";
}

  document.getElementById("newCal").textContent = resultText;
  document.getElementById("detail").innerHTML = detailText;
  document.getElementById("out").style.display = "block";
}

function renderMonthGrid(activeDayInMonth, anchorLocal){
  const highlights = getMonthHighlightsForYear(CURRENT_ANCHOR_YEAR, CURRENT_MONTH_INDEX);

  const container = document.getElementById("monthGrid");
  if(!container) return;

  const header = document.createElement("div");
  header.className = "weekHeader";
  const labels = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
  labels.forEach(l => {
    const el = document.createElement("div");
    el.textContent = l;
    header.appendChild(el);
  });

  const grid = document.createElement("div");
  grid.className = "grid28";

  for(let d = 1; d <= 28; d++){
    const cell = document.createElement("div");

    const weekIndex = Math.floor((d - 1) / 7) + 1;
    cell.classList.add("dayCell", `week-${weekIndex}`);

    const dayDeltaCell = (CURRENT_MONTH_INDEX * 28) + (d - 1);
    const cellDate = getCellDateFromDayDelta(anchorLocal, dayDeltaCell);
    const astroCell = getAstroStateForDate(cellDate);

    if (!astroCell.error && !astroCell.isTransition) {
      const line = document.createElement("div");
      line.classList.add("mesoLine", `meso-${astroCell.mesoKey}`);
      cell.appendChild(line);
    }

    if (highlights.windowDays.has(d)) {
      cell.classList.add("seasonWindow");
      cell.classList.add(highlights.typeByDay[d] || "");
    }
    if (highlights.climaxDays.has(d)) {
      cell.classList.add("climax");
    }

    if(d === activeDayInMonth){
      cell.classList.add("active");
    }

    const num = document.createElement("span");
    num.className = "dayNum";
    num.textContent = d;
    cell.appendChild(num);

    grid.appendChild(cell);
  }

  container.innerHTML = "";
  container.appendChild(header);
  container.appendChild(grid);
}

function getSeasonKeyByIndex(idx){
  return ["primavera","verano","otono","invierno"][idx];
}

function getSeasonIndex(dayDelta){
  return Math.floor(dayDelta / 91); // 0..3
}

function getDayInSeason(dayDelta){
  return dayDelta % 91; // 0..90
}

function isTransitionWeek(dayDelta){
  return getDayInSeason(dayDelta) >= 84; // last 7 days of season
}

function getTransitionKey(fromSeasonIdx){
  const fromKey = getSeasonKeyByIndex(fromSeasonIdx);
  const toKey = getSeasonKeyByIndex((fromSeasonIdx + 1) % 4);
  return `${fromKey}->${toKey}`;
}

function getMesoStageKey(dayDelta){
  const dis = getDayInSeason(dayDelta);
  if(dis >= 84) return null; // transition: no meso line
  const stageIndex = Math.floor(dis / 21);
  return ["apertura","desarrollo","evaluacion","cierre"][stageIndex];
}

function getMicroWeek(dayInMonth){
  return Math.floor((dayInMonth - 1) / 7) + 1; // 1..4
}

function renderStandardPanel(dayDelta, dayInMonth, year){
  const ctx = document.getElementById("contextPanel");
  if(!ctx) return;

  const starts = getSeasonStartsForYear(year);
  const season = getSeasonByStarts(dayDelta, starts);
  const seasonKey = season.key;
  const macro = MACRO[seasonKey];

  const mesoKey = getMesoStageKey(dayDelta);

if (!mesoKey) {
  ctx.innerHTML = ""; 
  return;
}

  const mesoUni = MESO_UNIVERSAL[mesoKey];
  const mesoSpec = MESO_ESPECIFICO[seasonKey][mesoKey];
  const mesoCombined = `${mesoUni.phrase} ${mesoSpec}`;

  const microWeek = getMicroWeek(dayInMonth);
  const micro = MICRO[microWeek];

  ctx.innerHTML = `

    <div class="sub"><b>Qué se está trabajando:</b><br>${macro.working}</div>
    <div class="sub" style="margin-top:8px;"><b>Frase macrociclo:</b><br>${macro.phrase}</div>

    <div class="sub" style="margin-top:10px;"><b>Qué ocurre:</b><br>${mesoUni.occurs}</div>

    <div class="sub titleLine"><b>${micro.label}</b></div>
    <div class="sub" style="margin-top:6px;"><b>Frase microciclo:</b><br>${micro.phrase}</div>
    <div class="sub" style="margin-top:10px;"><b>Preguntas clave:</b></div>
    <ul>${microQs}</ul>
  `;
}

function getToSeasonKey(transKey){
  const map = {
    "invierno->primavera":"primavera",
    "primavera->verano":"verano",
    "verano->otono":"otono",
    "otono->invierno":"invierno"
  };
  return map[transKey];
}

function renderTransitionPanel(dayDelta, tInfo){
  const ctx = document.getElementById("contextPanel");
  if(!ctx) return;

  const key = tInfo.transKey;        // "otono->invierno", etc.
  const t = TRANSITIONS[key];
  const mode = tInfo.mode;           // "iniciacion" | "climax" | "integracion"
  const phase = t[mode];

  const univQs = (mode === "iniciacion"
      ? TRANS_UNIV.iniciacion
      : (mode === "climax" ? TRANS_UNIV.climax : TRANS_UNIV.integracion)
    )
    .map(q => `<li>${q}</li>`)
    .join("");

  const specQs = (phase.specQs || [])
    .map(q => `<li>${q}</li>`)
    .join("");

  // Header según especificación
  let headerHtml = "";
  if(mode === "climax"){
    headerHtml = `<div class="k">Clímax — ${tInfo.eventName || t.event}</div>`;
  } else if(mode === "integracion"){
    const toKey = getToSeasonKey(tInfo.transKey);
    headerHtml = `<div class="k">Inicio de ${toKey.charAt(0).toUpperCase() + toKey.slice(1)}</div>`;
  } else {
    headerHtml = `
      <div class="k">${t.header}</div>
      <div class="sub">${t.descriptor}</div>
      <div class="sub" style="margin-top:10px;"><b>Sentido del cruce</b><br>${(t.sentido || "").replace(/\n/g,"<br>")}</div>
    `;
  }

  // Qué se está trabajando (en iniciación + integración usa workOfTo; en clímax usa phase.working si existe)
  let workingText = "";
  if(mode === "climax"){
    workingText = phase.working || t.workOfTo || "";
  } else {
    workingText = t.workOfTo || "";
  }

  const workingBlock = workingText
    ? `<div class="sub" style="margin-top:12px;"><b>Qué se está trabajando:</b><br>${workingText}</div>`
    : "";

  const title = mode === "iniciacion" ? "Iniciación" : (mode === "integracion" ? "Integración" : "");
  const phaseTitle = (mode === "climax")
    ? ""
    : `<div class="k" style="margin-top:18px;">${title}</div>`;

  ctx.innerHTML = `
    ${headerHtml}
    ${workingBlock}

    ${phaseTitle}
    <div class="sub" style="margin-top:8px;">${(phase.statement || "").replace(/\n/g,"<br>")}</div>
    <div class="sub" style="margin-top:10px;"><b>Función:</b><br>${phase.funcion || ""}</div>

    <div class="sub" style="margin-top:14px;"><b>Preguntas (Universales):</b></div>
    <ul>${univQs}</ul>

    <div class="sub" style="margin-top:10px;"><b>Preguntas (Específicas del cruce):</b></div>
    <ul>${specQs}</ul>

    <div class="emp">${phase.emp || ""}</div>
  `;
}

function renderTransitionPanelAstro(astro, selectedLocal, dayInMonth){
  const ctx = document.getElementById("contextPanel");
  if(!ctx) return;

  const t = TRANSITIONS[astro.transKey];
  const mode = astro.mode;
  const phase = t[mode];

  const univQs = TRANS_UNIV[mode].map(q=>`<li>${q}</li>`).join("");
  const specQs = phase.specQs.map(q=>`<li>${q}</li>`).join("");

  let headerHtml = "";
  if(mode === "climax"){
    headerHtml = `<div class="k">Clímax — ${astro.eventName}</div>`;
  } else if(mode === "integracion"){
    const toKey = getToSeasonKey(astro.transKey);
    headerHtml = `<div class="k">Inicio de ${toKey.charAt(0).toUpperCase() + toKey.slice(1)}</div>`;
  } else {
    headerHtml = `
      <div class="k">${t.header}</div>
      <div class="sub">${t.descriptor}</div>
      <div class="sub" style="margin-top:10px;"><b>Sentido del cruce</b><br>${t.sentido.replace(/\n/g,"<br>")}</div>
    `;
  }

  const workingText = (mode === "climax") ? (phase.working || "") : (t.workOfTo || "");
  const workingBlock = `<div class="sub" style="margin-top:12px;"><b>Qué se está trabajando:</b><br>${workingText}</div>`;

  const phaseTitle = (mode === "climax")
    ? ""
    : `<div class="k" style="margin-top:18px;">${mode === "iniciacion" ? "Iniciación" : "Integración"}</div>`;

  ctx.innerHTML = `
    ${headerHtml}
    ${workingBlock}
    ${phaseTitle}

    <div class="sub" style="margin-top:8px;">${phase.statement.replace(/\n/g,"<br>")}</div>
    <div class="sub" style="margin-top:10px;"><b>Función:</b><br>${phase.funcion}</div>

    <div class="sub" style="margin-top:14px;"><b>Preguntas (Universales):</b></div>
    <ul>${univQs}</ul>

    <div class="sub" style="margin-top:10px;"><b>Preguntas (Específicas del cruce):</b></div>
    <ul>${specQs}</ul>

    <div class="emp">${phase.emp}</div>
    ${renderUpcomingBlock(selectedLocal, dayInMonth)}
  `;
}

window.addEventListener("DOMContentLoaded", () => {
  setTodayDefault();
  convert(); // convierte en automático
});

</script>
</body>
</html>
