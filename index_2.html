<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Conversor Calendario Nuevo</title>
  <style>
    :root {
        --accent: #2f6f5f;      /* verde sobrio */
        --accent-soft: #e6f2ef; /* verde muy claro */
        --accent-strong: #1f4d42;
    }

    h1 {
        color: var(--accent-strong);
    }

    body { font-family: system-ui, Arial; margin: 24px; max-width: 720px; }
    input, button { padding: 10px; font-size: 16px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .card { margin-top: 16px; padding: 16px; border: 1px solid #ddd; border-radius: 10px; }
    .label { color: #666; font-size: 14px; margin-bottom: 6px; }
    .value { font-size: 20px; font-weight: 600; }

    .weekHeader {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 8px;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 700;          /* ← negritas */
        color: #1f4d42;            /* mismo tono del acento */
        text-align: center;
    }

    .grid28 {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 8px;
    }

    .dayCell {
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 10px 0;
        text-align: center;
        font-weight: 600;
        position: relative;
        user-select: none;
    }

    .dayCell.active {
        background: var(--accent-soft);
        box-shadow: 0 0 0 2px var(--accent) inset;
        color: var(--accent-strong);
    }

    .dayCell.active::after {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--accent);
    }

    /* Colores suaves por semana */
    .week-1 {
        background: rgba(220, 60, 60, 0.10);   /* rojo suave */
    }

    .week-2 {
        background: rgba(255, 255, 255, 0.8); /* blanco / neutro */
    }

    .week-3 {
        background: rgba(70, 130, 220, 0.12); /* azul suave */
    }

    .week-4 {
        background: rgba(240, 200, 70, 0.18); /* amarillo suave */
    }

    /* Para que el color se vea como banda */
    .week-1,
    .week-2,
    .week-3,
    .week-4 {
        border-radius: 12px;
    }

    /* Resaltado de ventana solar (Apertura/Clímax/Integración) */
    .dayCell.seasonWindow {
        outline: 2px dashed rgba(0,0,0,0.12);
        outline-offset: -3px;
    }

    .dayCell.climax {
        outline: 2px solid rgba(0,0,0,0.35);
        outline-offset: -3px;
    }

    /* Opcional: tonos distintos por tipo */
    .dayCell.equinox { box-shadow: 0 0 0 2px rgba(70,130,220,0.18) inset; }
    .dayCell.solstice { box-shadow: 0 0 0 2px rgba(240,200,70,0.22) inset; }

  </style>

    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">

</head><body>
  <h1>Conversor: Gregoriano → Calendario Nuevo</h1>

  <div class="row">
    <input id="date" type="date" />
    <button onclick="convert()">Convertir</button>
  </div>

  <div class="card" id="out" style="display:none;">
    <div class="label">Calendario nuevo</div>
    <div class="value" id="newCal"></div>
    <div class="label" style="margin-top:12px;">Detalle</div>
    <div id="detail"></div>
    
    <div style="margin-top:16px;">
        <div class="label">Mes (4 semanas)</div>
        <div id="monthGrid"></div>
    </div>

  </div>

<script>
const months = ["Marzo","Abril","Mayo","Sol","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre","Enero","Febrero"];
const weekdays = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const WINDOW_DAYS = 3; // 3 antes + clímax + 3 después (7 días)

let CURRENT_MONTH_INDEX = 0;
let CURRENT_ANCHOR_YEAR = null;

// Fechas gregorianas (local) del CLÍMAX por año.
// Ajustables cuando quieras (y pueden “bailar” un día según zona horaria).
const SOLAR_EVENTS = {
  2025: {
    springEquinox: "2025-03-20",
    summerSolstice: "2025-06-21",
    autumnEquinox: "2025-09-22",
    winterSolstice: "2025-12-21",
  },
  2026: {
    springEquinox: "2026-03-20",
    summerSolstice: "2026-06-21",
    autumnEquinox: "2026-09-22",
    winterSolstice: "2026-12-21",
  },
  2027: {
    springEquinox: "2027-03-20",
    summerSolstice: "2027-06-21",
    autumnEquinox: "2027-09-23",
    winterSolstice: "2027-12-21",
  },
  2028: {
    springEquinox: "2028-03-20",
    summerSolstice: "2028-06-20",
    autumnEquinox: "2028-09-22",
    winterSolstice: "2028-12-21",
  },
  2029: {
    springEquinox: "2029-03-20",
    summerSolstice: "2029-06-21",
    autumnEquinox: "2029-09-22",
    winterSolstice: "2029-12-21",
  },
};

function parseLocalISO(iso){ // "YYYY-MM-DD" a Date local
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y, m-1, d); // local
}

function daysBetweenLocal(a, b){
  const msPerDay = 24*60*60*1000;
  const da = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const db = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((da - db)/msPerDay);
}

// Dada una fecha local (gregoriana), devuelve {monthIndex, dayInMonth, delta} según tu ancla.
function gregorianToNewLocal(localDate){
  const y = localDate.getFullYear();
  let anchor = firstSundayOfMarch(y);
  // firstSundayOfMarch usa UTC en tu código; aquí lo convertimos a local equivalente:
  anchor = new Date(anchor.getUTCFullYear(), anchor.getUTCMonth(), anchor.getUTCDate());

  if(localDate < anchor){
    let a2 = firstSundayOfMarch(y-1);
    anchor = new Date(a2.getUTCFullYear(), a2.getUTCMonth(), a2.getUTCDate());
  }

  const delta = daysBetweenLocal(localDate, anchor);
  if(delta < 0 || delta > 363) return null;

  const monthIndex = Math.floor(delta / 28);
  const dayInMonth = (delta % 28) + 1;
  return { monthIndex, dayInMonth, delta };
}

// Construye un set de días (1..28) a resaltar para el mes actual, con flags de climax
function getMonthHighlightsForYear(targetYear, currentMonthIndex){
  const ev = SOLAR_EVENTS[targetYear];
  if(!ev) return { windowDays: new Set(), climaxDays: new Set(), typeByDay: {} };

  const events = [
    { key: "springEquinox", type: "equinox" },
    { key: "autumnEquinox", type: "equinox" },
    { key: "summerSolstice", type: "solstice" },
    { key: "winterSolstice", type: "solstice" },
  ];

  const windowDays = new Set();
  const climaxDays = new Set();
  const typeByDay = {}; // day -> "equinox"|"solstice"

  for(const e of events){
    const center = parseLocalISO(ev[e.key]);
    for(let offset = -WINDOW_DAYS; offset <= WINDOW_DAYS; offset++){
      const d = new Date(center);
      d.setDate(d.getDate() + offset);

      const mapped = gregorianToNewLocal(d);
      if(!mapped) continue;

      // solo si cae en el mes que estamos mostrando
      if(mapped.monthIndex === currentMonthIndex){
        windowDays.add(mapped.dayInMonth);
        typeByDay[mapped.dayInMonth] = e.type;
        if(offset === 0) climaxDays.add(mapped.dayInMonth);
      }
    }
  }

  return { windowDays, climaxDays, typeByDay };
}

function firstSundayOfMarch(year){
  // busca el primer domingo entre 1 y 7 de marzo
  for(let day=1; day<=7; day++){
    const d = new Date(Date.UTC(year, 2, day)); // mes 2 = marzo (UTC)
    if(d.getUTCDay() === 0) return d; // 0 = domingo
  }
  throw new Error("No se encontró domingo en 1-7 de marzo (imposible).");
}

function setTodayDefault(){
  const now = new Date(); // fecha local del dispositivo
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  document.getElementById("date").value = `${y}-${m}-${d}`;
}

function toISODateUTC(d){
  // d es Date en UTC. devuelve YYYY-MM-DD
  const y = d.getUTCFullYear();
  const m = String(d.getUTCMonth()+1).padStart(2,'0');
  const da = String(d.getUTCDate()).padStart(2,'0');
  return `${y}-${m}-${da}`;
}

function parseInputDateToUTC(){
  const val = document.getElementById("date").value; // YYYY-MM-DD
  if(!val) return null;
  const [y,m,d] = val.split("-").map(Number);
  // Construimos la fecha como "medianoche UTC" del día elegido
  return new Date(Date.UTC(y, m-1, d));
}

function convert(){
  const input = parseInputDateToUTC();
  if(!input) return;

  const y = input.getUTCFullYear();
  let anchor = firstSundayOfMarch(y);
  if(input < anchor){
    anchor = firstSundayOfMarch(y-1);
  }

  // delta días respecto al anchor (Marzo 1)
  const msPerDay = 24*60*60*1000;
  const delta = Math.floor((input - anchor)/msPerDay);

  let resultText = "";
  let detailText = `Ancla (Marzo 1): ${toISODateUTC(anchor)} (Domingo)<br/>`;

  if (delta === -1) {
  resultText = "Día 0 (Día Fuera del Tiempo)";
  detailText += `Fecha gregoriana: ${toISODateUTC(input)}<br/>No tiene día de semana dentro del calendario nuevo.`;

  // Día 0: no hay mes, así que ocultamos/limpiamos la cuadrícula
  const mg = document.getElementById("monthGrid");
  if (mg) mg.innerHTML = "";

} else if (delta >= 0 && delta <= 363) {
  const monthIndex = Math.floor(delta / 28);
  const dayInMonth = (delta % 28) + 1;
  const weekday = weekdays[delta % 7];

  CURRENT_MONTH_INDEX = monthIndex;
  CURRENT_ANCHOR_YEAR = input.getUTCFullYear();

  resultText = `${months[monthIndex]} ${dayInMonth} (${weekday})`;
  detailText += `Delta desde ancla: ${delta} días<br/>`;
  detailText += `Mes #: ${monthIndex + 1} de 13<br/>`;
  detailText += `Día de semana (nuevo): ${weekday}`;

  // Aquí sí dibujamos el mes y marcamos el día
  renderMonthGrid(dayInMonth);

} else {
  resultText = "Fuera de rango (revisa ancla o fecha).";
  detailText += `Delta: ${delta}`;

  // Si por alguna razón cae fuera de rango, también limpia la cuadrícula
  const mg = document.getElementById("monthGrid");
  if (mg) mg.innerHTML = "";
}

  document.getElementById("newCal").textContent = resultText;
  document.getElementById("detail").innerHTML = detailText;
  document.getElementById("out").style.display = "block";
}

function renderMonthGrid(activeDayInMonth){
  const highlights = getMonthHighlightsForYear(
    CURRENT_ANCHOR_YEAR,
    CURRENT_MONTH_INDEX
  );

  const container = document.getElementById("monthGrid");
  if(!container) return;

  // Encabezado de días (como tu hoja)
  const header = document.createElement("div");
  header.className = "weekHeader";
  const labels = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
  labels.forEach(l => {
    const el = document.createElement("div");
    el.textContent = l;
    header.appendChild(el);
  });

  // Grid 1–28
  const grid = document.createElement("div");
  grid.className = "grid28";

  // Necesitamos saber qué mes estamos mostrando. Lo más simple: guardarlo globalmente.

  for(let d = 1; d <= 28; d++){
  const cell = document.createElement("div");

  const weekIndex = Math.floor((d - 1) / 7) + 1; // 1 a 4
  cell.classList.add("dayCell");
  cell.classList.add(`week-${weekIndex}`);

  if(d === activeDayInMonth){
    cell.classList.add("active");
  }

  if (highlights.windowDays.has(d)) {
  cell.classList.add("seasonWindow");
  cell.classList.add(highlights.typeByDay[d] || "");
  }

if (highlights.climaxDays.has(d)) {
  cell.classList.add("climax");
}

  cell.textContent = d;
  grid.appendChild(cell);
}

  container.innerHTML = "";
  container.appendChild(header);
  container.appendChild(grid);
}

window.addEventListener("DOMContentLoaded", () => {
  setTodayDefault();
  convert(); // convierte en automático
});

</script>
</body>
</html>
